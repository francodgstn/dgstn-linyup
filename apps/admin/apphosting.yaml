# Firebase App Hosting config for the operator console (@linyup/admin).
# Deploy as a SEPARATE backend (rootDirectory: apps/admin) on its own domain:
# ops.linyup.com (prod) and ops-stg.linyup.com (staging). Domains follow a
# surface-then-environment scheme — app.linyup.com / app-stg.linyup.com for the
# web app, ops.* for this console — with linyup.com reserved for the marketing
# site and demo.linyup.com kept as-is because prospects see it during demos.
# (An earlier note here suggested ops.linyup.app; that domain was never owned.)
#
# Runtime identity: point this backend at the dedicated `linyup-admin` service
# account (NOT the shared firebase-app-hosting-compute SA used by apps/web). That
# SA and all its IAM are managed in Terraform (infra/modules/iam + secrets):
#   - roles/datastore.user                     — read accounts/metrics + write
#                                                 app_settings/global_settings
#   - roles/secretmanager.secretVersionAdder   — save the provider keys the
#     + viewer on admin_writable_secret_ids       Settings pages manage (Brevo,
#                                                 DeepL, Stripe, Cloudflare)
#   - roles/firebaseapphosting.computeRunner + firebase.sdkAdminServiceAgent +
#     developerconnect.readTokenAccessor       — required for an App Hosting backend
# Terraform creates those secret CONTAINERS, so no create permission is needed
# at runtime. See the "Operator console" section in infra/README.md.
runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80

env:
  # Operator allowlist (comma-separated). Set per environment.
  - variable: OPERATOR_EMAILS
    value: franco.dgstn@gmail.com
    availability:
      - RUNTIME

  # SERVER-side project id for the Admin SDK (src/lib/firebase-admin.ts). REQUIRED:
  # that file resolves FIREBASE_PROJECT_ID || GOOGLE_CLOUD_PROJECT || GCLOUD_PROJECT
  # and falls back to 'demo-linyup'. App Hosting populates FIREBASE_CONFIG but NONE
  # of those three (Cloud Run doesn't set GOOGLE_CLOUD_PROJECT), and the explicit
  # projectId passed to initializeApp overrides FIREBASE_CONFIG — so without this the
  # SDK initialises as 'demo-linyup' and verifyIdToken rejects every real token
  # ("invalid token" on /api/auth/session), because the token's audience is this
  # project. Also fixes adminBucket and the target label in the shell.
  # RUNTIME only — read per request, never inlined into the bundle (unlike the
  # NEXT_PUBLIC_* values below, which need BUILD for exactly that reason).
  - variable: FIREBASE_PROJECT_ID
    value: linyup-staging
    availability:
      - RUNTIME

  # Public client Firebase config — used ONLY by the login page (Google sign-in).
  # These are public values (they ship in the JS bundle), reused from the same
  # Firebase web app as apps/web. The admin client reads only these four keys
  # (apiKey, authDomain, projectId, appId) — no storage/messaging/database — so
  # the rest of `terraform output -json firebase_web_config` is not needed here.
  #
  # Base file = STAGING (mirrors apps/web/apphosting.yaml). Prod values live in
  # apphosting.prod.yaml. Source: `cd infra/environments/<env> &&
  # terraform output -json firebase_web_config`.
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: linyup-staging
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: linyup-staging.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:157648925506:web:5e3aa70930d777f8374edb
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAuMHWbGKmyL78xVfrStkIctShzqrd4zcg
    availability:
      - BUILD
      - RUNTIME
