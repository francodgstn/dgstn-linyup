# Firebase App Hosting — environment-specific overrides for the SANDBOX backend.
#
# App Hosting merges this over the base apphosting.yaml when the backend's
# "Environment name" is set to `sandbox` (Console → App Hosting → backend →
# settings, or `apphosting:backends:create --environment sandbox`). Values here
# take precedence over the base file.
#
# This points the demo playground web app at the linyup-sandbox project and turns
# on NEXT_PUBLIC_DEMO_MODE so the public /try page is reachable. The base
# apphosting.yaml does NOT set NEXT_PUBLIC_DEMO_MODE, so staging/prod never expose
# the demo logins.
#
# Fill the NEXT_PUBLIC_FIREBASE_* values from the sandbox stack outputs:
#   cd infra/environments/sandbox && terraform output -json firebase_web_config

env:
  # Demo playground — exposes the public /try page (sandbox only).
  - variable: NEXT_PUBLIC_DEMO_MODE
    value: "true"
    availability:
      - BUILD
      - RUNTIME

  # Inbound webhooks (Automations → Webhooks). MUST be overridden here: the base
  # apphosting.yaml carries the staging URL, and this file merges over it — without
  # this line sandbox would hand out staging's webhook URL.
  - variable: NEXT_PUBLIC_INBOUND_WEBHOOK_URL
    value: https://europe-west6-linyup-sandbox.cloudfunctions.net/inboundWebhook
    availability:
      - BUILD
      - RUNTIME

  # Firebase App Check — the reCAPTCHA v3 SITE KEY (public, safe to embed), the
  # one piece of deployment wiring the App Check rollout needs from this file.
  # Commented out because the key does not exist until the project is registered
  # in the Console (docs/app-check-rollout.md step 1), and App Hosting rejects
  # `value: ""` — so the slot cannot be pre-declared empty, only pre-described.
  #
  # BUILD availability is the LOAD-BEARING part. NEXT_PUBLIC_* is inlined into the
  # JS bundle at build time, so a value supplied only at runtime — a variable added
  # in the Console without BUILD, say — never reaches the browser: initAppCheck()
  # reads undefined, no-ops, and the client sends no token. That failure is silent
  # and looks exactly like a bad registration, which is what the runbook's "watch
  # the monitor logs" step would have you conclude. Set it here and redeploy web.
  # - variable: NEXT_PUBLIC_FIREBASE_APPCHECK_RECAPTCHA_KEY
  #   value: <reCAPTCHA v3 site key for linyup-sandbox>
  #   availability:
  #     - BUILD
  #     - RUNTIME

  # Firebase web config — public values (embedded in the JS bundle).
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: linyup-sandbox
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: linyup-sandbox.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_DATABASE_URL
    value: https://linyup-sandbox.firebaseio.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: linyup-sandbox.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  # TODO: replace the three generated values below from `terraform output
  # -json firebase_web_config` after the sandbox project is created.
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "1006203712444"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:1006203712444:web:5f1a15e86998c7a42671b9
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyANE6K6TejYLR9I75O88SLotpnDullEGjw
    availability:
      - BUILD
      - RUNTIME
