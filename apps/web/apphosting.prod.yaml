# Firebase App Hosting — Next.js SSR on Cloud Run (production)
# Node version is read from package.json engines.node.
# App Hosting picks this file automatically when the backend ID is "prod".

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  # Firebase web config — these are public values (embedded in the JS bundle)
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: linyup-prod
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: linyup-prod.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_DATABASE_URL
    value: https://linyup-prod-default-rtdb.europe-west1.firebasedatabase.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: linyup-prod.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "576514050360"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:576514050360:web:f85b1c9c1dc0d7efbc99cd
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCAYQcDgB9wBXylM33jbCfHfR7uQpw3tUE
    availability:
      - BUILD
      - RUNTIME
  # Inbound webhooks (Automations → Webhooks). MUST be overridden here: the base
  # apphosting.yaml carries the staging URL and this file merges over it, so
  # without this line prod would hand customers a staging webhook URL. App Hosting
  # rejects `value: ""`, so the variable cannot be unset once the base defines it —
  # it can only be pointed at the right project.
  - variable: NEXT_PUBLIC_INBOUND_WEBHOOK_URL
    value: https://europe-west6-linyup-prod.cloudfunctions.net/inboundWebhook
    availability:
      - BUILD
      - RUNTIME
  # Firebase App Check — the reCAPTCHA v3 SITE KEY (public, safe to embed), the
  # one piece of deployment wiring the App Check rollout needs from this file.
  # Commented out because the key does not exist until the project is registered
  # in the Console (docs/app-check-rollout.md step 1), and App Hosting rejects
  # `value: ""` — so the slot cannot be pre-declared empty, only pre-described.
  #
  # BUILD availability is the LOAD-BEARING part. NEXT_PUBLIC_* is inlined into the
  # JS bundle at build time, so a value supplied only at runtime — a variable added
  # in the Console without BUILD, say — never reaches the browser: initAppCheck()
  # reads undefined, no-ops, and the client sends no token. That failure is silent
  # and looks exactly like a bad registration, which is what the runbook's "watch
  # the monitor logs" step would have you conclude. Set it here and redeploy web.
  # - variable: NEXT_PUBLIC_FIREBASE_APPCHECK_RECAPTCHA_KEY
  #   value: <reCAPTCHA v3 site key for linyup-prod>
  #   availability:
  #     - BUILD
  #     - RUNTIME

  # PostHog product analytics — public project key (safe to embed, like the
  # Firebase keys above). Paste your prod PostHog project key (phc_…) here to turn
  # analytics on; while empty, initPostHog() stays a no-op.
  - variable: NEXT_PUBLIC_POSTHOG_KEY
    value: phc_qmkpHEQ26DUdFoGPPHZ26Enz2wfPVgHeLegi7ivArCWi
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_POSTHOG_HOST
    value: https://eu.i.posthog.com
    availability:
      - BUILD
      - RUNTIME
