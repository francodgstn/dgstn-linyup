# Firebase App Hosting — Next.js SSR on Cloud Run
# Node version is read from package.json engines.node.

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 2
  concurrency: 80

env:
  # Firebase web config — these are public values (embedded in the JS bundle)
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: linyup-staging
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: linyup-staging.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_DATABASE_URL
    value: https://linyup-staging.firebaseio.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: linyup-staging.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "157648925506"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:157648925506:web:5e3aa70930d777f8374edb
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAuMHWbGKmyL78xVfrStkIctShzqrd4zcg
    availability:
      - BUILD
      - RUNTIME
  # Inbound webhooks (Automations → Webhooks). Without this the endpoints dialog
  # cannot render an endpoint's full URL and shows the "not available in this
  # environment yet" notice — the inboundWebhook function itself is deployed and
  # public regardless. Use the cloudfunctions.net alias, not the *.a.run.app URL:
  # the latter carries a generated hash that changes if the service is recreated.
  # NEXT_PUBLIC_* is inlined at build time, so BUILD availability is what matters
  # and a redeploy is required for a change here to reach the browser.
  - variable: NEXT_PUBLIC_INBOUND_WEBHOOK_URL
    value: https://europe-west6-linyup-staging.cloudfunctions.net/inboundWebhook
    availability:
      - BUILD
      - RUNTIME
  # Firebase App Check — the reCAPTCHA v3 SITE KEY (public, safe to embed), the
  # one piece of deployment wiring the App Check rollout needs from this file.
  # Commented out because the key does not exist until the project is registered
  # in the Console (docs/app-check-rollout.md step 1), and App Hosting rejects
  # `value: ""` — so the slot cannot be pre-declared empty, only pre-described.
  #
  # BUILD availability is the LOAD-BEARING part. NEXT_PUBLIC_* is inlined into the
  # JS bundle at build time, so a value supplied only at runtime — a variable added
  # in the Console without BUILD, say — never reaches the browser: initAppCheck()
  # reads undefined, no-ops, and the client sends no token. That failure is silent
  # and looks exactly like a bad registration, which is what the runbook's "watch
  # the monitor logs" step would have you conclude. Set it here and redeploy web.
  # - variable: NEXT_PUBLIC_FIREBASE_APPCHECK_RECAPTCHA_KEY
  #   value: <reCAPTCHA v3 site key for linyup-staging>
  #   availability:
  #     - BUILD
  #     - RUNTIME

  # PostHog product analytics — intentionally NOT set on staging so it does not
  # pollute the prod PostHog project. initPostHog() treats a missing key as a
  # no-op (see apps/web/src/lib/posthog.ts). To enable staging analytics, add a
  # NEXT_PUBLIC_POSTHOG_KEY variable here with a dedicated staging key (a
  # phc_… value). Do NOT use `value: ""` — App Hosting rejects an empty string
  # with "either 'value' or 'secret' field is required".
  - variable: NEXT_PUBLIC_POSTHOG_HOST
    value: https://eu.i.posthog.com
    availability:
      - BUILD
      - RUNTIME
