name: Verify

# `workflow_call` lets the deploy workflows run these exact checks as a gate
# before shipping. Until that was wired, verify ran on pull requests ONLY — so a
# tagged release, or anything that reached `main` without a PR, deployed to a real
# project having never been typechecked, linted or tested.
#
# Keep this workflow free of secrets. It builds with placeholder env values on
# purpose, which is what makes it safe to call from anywhere.
on:
  pull_request:
    branches: [main]
  # ALSO ON `main` ITSELF, because two green PRs can merge into a red branch.
  #
  # A source-reading test is pinned to a spelling in another package, so a PR
  # that renames the spelling and a PR that asserts it are each green against
  # their own base and broken together. That is exactly what happened on
  # 2026-09-11: #292 turned `collectionGroup(db, 'bookings')` into a path
  # constant, `checkoutClaim.test.ts` kept grepping for the literal, and `main`
  # went red with nothing scheduled to notice — the next PR to open inherited
  # the failure and looked like the culprit.
  #
  # Runs the same secret-free checks, so this costs minutes and nothing else.
  push:
    branches: [main]
  workflow_call: {}

# A newer push to the same PR supersedes the older run. Cancellation is scoped to
# `pull_request` alone: a deploy's gate must never be cancelled by another deploy
# (deploy.yml serialises those itself), and a `main` run must not be cancelled by
# the next merge — the run that would be discarded is the one naming which commit
# turned the branch red. The group keys on `github.ref`, so PR runs
# (`refs/pull/N/merge`) and `main` runs (`refs/heads/main`) never share a slot.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all packages
        run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # apps/web has no test runner, so this is the only place locale parity is
      # enforced. It also fails if a lane's message fragment was never merged.
      - name: Locales
        run: pnpm i18n:check

      # The LOG-list tripwire (docs/scalability-2026-09.md §19): a direct read
      # of a collection that grows with time must carry a bound, or be
      # acknowledged in the script with a reason. Needs @linyup/shared built,
      # which the lint step's ^build dependency already did.
      - name: Unbounded reads
        run: pnpm census:reads

      # scripts/ is not a workspace, so `turbo run typecheck` never sees the
      # seeders, the backfills or the HMD migration — which is a root cause of
      # the drift docs/seed-truth-2026-08.md catalogues. This is the only place
      # they are typechecked.
      #
      # It used to check a hand-maintained LIST of seven paths against a
      # directory of twenty-seven files, so every backfill, purge-team,
      # reset-sandbox-db and stripe-sync was checked by nobody, and
      # scripts/migrate-hmd.ts sat in that gap until it broke. The include is a
      # glob now: adding a script is enough to have it checked.
      - name: Seed scripts
        run: pnpm typecheck:seeds

  test-functions:
    name: Functions Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @linyup/shared run build

      - name: Build functions
        run: pnpm --filter @linyup/functions run build

      # mocha exits 1 on "No test files found"; run it only once tests exist so
      # the job stays green until function tests are added (and fails on real
      # test failures thereafter).
      # No FIRESTORE_EMULATOR_HOST here: the mocha suite is emulator-free by
      # construction (every Firestore-touching path is behind a DI seam). The
      # rules suite below is the one that needs an emulator.
      - name: Run function tests
        run: |
          if find packages/functions/src -name '*.test.ts' | grep -q .; then
            pnpm --filter @linyup/functions run test
          else
            echo "No function tests yet — skipping."
          fi

  # Firestore + Storage rules, run against the real emulator. Until 2026-09 this
  # suite ran on nobody's machine but the author's, and it was red at HEAD for a
  # week (a contacts catch-all overriding an `if false`) with CI green the whole
  # time. Java 21 is the emulator's floor; the jars (~190 MB) are cached across
  # runs, keyed on the firebase-tools version so an upgrade refetches them.
  test-rules:
    name: Firestore & Storage Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Firebase-tools version (cache key)
        id: fbt
        run: echo "version=$(node -p "require('firebase-tools/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache emulator jars
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ steps.fbt.outputs.version }}

      - name: Build shared package
        run: pnpm --filter @linyup/shared run build

      - name: Rules tests
        run: pnpm --filter @linyup/functions run test:rules

  build-admin:
    name: Build Admin Console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @linyup/shared run build

      - name: Build admin console
        run: pnpm --filter @linyup/admin run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: placeholder
          NEXT_PUBLIC_FIREBASE_APP_ID: placeholder

  # The MAIN PRODUCT, and until 2026-08-26 the ONLY app CI never built — so a
  # broken web frontend (a bad import, a type error the SSG pass alone catches, a
  # server-component misuse) was found only after functions and rules had already
  # released. The build runs with placeholder Firebase config: firebase.ts guards
  # getAuth() out of the module scope, so an undefined value never crashes the
  # SSG pass. `typedRoutes` and the route validator run here for real.
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @linyup/shared run build

      - name: Build web app
        run: pnpm --filter @linyup/web run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: placeholder.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: placeholder

  build-landing:
    name: Build Landing Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build landing site
        run: pnpm --filter @linyup/landing run build
        # Keep these matching deploy.yml / deploy-prod.yml so the verify build
        # exercises the same config the real build uses. They were left on a
        # pre-rename `lineup.io` domain that has never existed for this product.
        env:
          PUBLIC_APP_URL: https://app.linyup.com
          PUBLIC_SITE_URL: https://linyup.com
