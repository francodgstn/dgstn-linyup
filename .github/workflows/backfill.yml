name: Backfill

# RUN A BACKFILL AGAINST A DEPLOYED PROJECT.
#
# There are a dozen or so `backfill:*` scripts in package.json and, until this
# workflow, exactly one way to point any of them at staging, sandbox or
# production: a developer's laptop holding Application Default Credentials. That
# is a poor place to run a script that writes to every tenant — nobody else can
# see it happen, the output lives in one terminal, and it needs a human with
# broad credentials sitting in front of it. Several of these scripts are DEPLOY
# PRECONDITIONS (`backfill-affiliation-active-orgs`, `backfill-document-versions`
# — see their headers), so "somebody remembered to run it locally" is the weakest
# link in shipping a denormalised field.
#
# Here it uses the same keyless Workload Identity Federation the deploys use, so
# no service-account key exists to leak, and the run is a link anybody can read.
#
# ── DISPATCH ONLY, AND A DRY RUN BY DEFAULT ─────────────────────────────────
#
# Nothing here fires on a push. A backfill is a deliberate act with a person
# behind it, and one that usually follows a deploy rather than accompanying it
# — the trigger and the indexes have to be live before repairing data against
# them. Usually: see the next section, and the script's own header.
#
# `apply` defaults to FALSE, so the obvious way to run this is the safe one:
# every script reports what it WOULD write and exits. Run it that way first and
# read the counts — they are the only check that the script is looking at what
# you think it is.
#
# The `environment` follows the project, so whatever reviewer gates protect a
# deploy to that project protect a backfill of it too. That matters most for
# production, which is precisely where nobody should be able to start one alone.
#
# ── WHERE A BACKFILL SITS IN A RELEASE IS THE SCRIPT'S OWN PROPERTY ─────────
#
# "After the deploy" is the usual case but not the rule, and an exception got
# wrong is silent, so READ THE TARGET SCRIPT'S HEADER before dispatching rather
# than assuming. Deploy order, for the ones in this list that turn on it:
#
#   * `ledger-ttl` runs BETWEEN two deploys — after the functions that stamp
#     new rows, before the `ttl: true` field overrides in firestore.index.json.
#   * `contact-counts` runs AFTER the functions deploy, so the trigger is live
#     and nothing written during the pass goes uncounted.
#
# Each script says so in its own header, in full and with the reasoning; this
# list is a pointer, not a substitute.

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Which backfill (the package.json script name, without "backfill:")'
        type: choice
        required: true
        options:
          - affiliation-active-orgs
          - activity-type-mirrors
          - booking-joined-at
          - contact-counts
          - contact-notes-count
          - document-mirrors
          - document-versions
          - finance
          - gateway-data
          - ledger-ttl
          - partner-apps
          - site-translations
          - subscription-lifecycle
          - team-public-profile
      project:
        description: 'Target Firebase project'
        type: choice
        required: true
        default: linyup-staging
        options:
          - linyup-staging
          - linyup-sandbox
          - linyup-prod
      apply:
        description: 'WRITE the changes. Leave off for a dry run that only reports.'
        type: boolean
        default: false
      extra_args:
        description: 'Extra flags for the script (e.g. --team abc123). Rarely needed.'
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

# One backfill at a time PER PROJECT. Two scans of the same collection group
# writing the same documents is a way to spend quota discovering nothing; a
# second run waits. Never cancel one in flight — these scripts are idempotent
# but a half-finished pass leaves a partially repaired collection, which reads
# on a dashboard as a number that is simply wrong.
concurrency:
  group: backfill-${{ inputs.project }}
  cancel-in-progress: false

jobs:
  backfill:
    name: ${{ inputs.apply && 'Apply' || 'Dry run' }} backfill:${{ inputs.script }} on ${{ inputs.project }}
    runs-on: ubuntu-latest
    # Reuses the deploy gates: staging is ungated, sandbox and production are
    # not. An expression is needed because the environment names and the project
    # ids are deliberately different vocabularies.
    environment: ${{ inputs.project == 'linyup-prod' && 'production' || inputs.project == 'linyup-sandbox' && 'sandbox' || 'staging' }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Pinned to match the deploy workflows — see the note in deploy.yml on
          # the Node 22.23.0 keep-alive regression under Workload Identity
          # Federation. These scripts authenticate the same way.
          node-version: '22.22.3'
          cache: 'pnpm'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The scripts import from `@linyup/shared`, which resolves to its BUILT
      # dist — the one thing a fresh checkout never has.
      - name: Build shared
        run: pnpm --filter @linyup/shared run build

      - name: Run the backfill
        env:
          # Pinned for the scripts that guard on it rather than on --project,
          # the same way the reseed step in deploy.yml does.
          GOOGLE_CLOUD_PROJECT: ${{ inputs.project }}
          # THE INPUTS REACH THE SHELL THROUGH THE ENVIRONMENT, not spliced into
          # the script text. `script` and `project` are `choice` inputs and so
          # are already constrained to the lists above, but `extra_args` is free
          # form — and a dispatch input interpolated into a `run:` block IS
          # shell, evaluated before bash ever sees it. Whoever can dispatch this
          # can already push a workflow, so the exposure is small; the habit is
          # what matters, because the next input somebody adds may not be.
          SCRIPT: ${{ inputs.script }}
          PROJECT: ${{ inputs.project }}
          APPLY: ${{ inputs.apply }}
          EXTRA_ARGS: ${{ inputs.extra_args }}
        run: |
          set -o pipefail
          # An `if`, not `[ … ] && …`: the runner's shell is `bash -e`, so a
          # one-liner whose test FAILS returns non-zero and takes the step with
          # it — the dry run, which is the default, would be the broken one.
          apply_flag=()
          if [ "$APPLY" = "true" ]; then apply_flag=(--apply); fi
          # $EXTRA_ARGS is deliberately unquoted so several flags word-split into
          # several arguments. A variable expansion is not re-evaluated, so this
          # splits without executing anything.
          # shellcheck disable=SC2086
          pnpm "backfill:$SCRIPT" --project "$PROJECT" "${apply_flag[@]}" $EXTRA_ARGS 2>&1 | tee backfill.log

      # The counts ARE the result, and a workflow log is a page nobody reopens.
      - name: Summarise
        if: always()
        run: |
          {
            echo "### backfill:${{ inputs.script }} — ${{ inputs.apply && '**APPLIED**' || 'dry run' }}"
            echo ""
            echo "Project: \`${{ inputs.project }}\` · commit \`${{ github.sha }}\`"
            echo ""
            echo '```'
            tail -n 40 backfill.log 2>/dev/null || echo '(the script produced no output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
