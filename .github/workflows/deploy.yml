name: Deploy Staging

# The staging web app (apps/web) auto-deploys via Firebase App Hosting's GitHub
# integration. This workflow covers everything else: Cloud Functions, Firestore
# rules/indexes, Storage rules, and the landing site.
#
# Runs on pushes to main and on manual dispatch. Staging *data* is reseeded
# ONLY on a manual run with reseed_data=true (it wipes all Firestore data + all
# auth users) — auto-deploys never touch data. You can also reseed locally with
# `pnpm staging:reset && pnpm staging:seed`.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reseed_data:
        description: 'DESTRUCTIVE: wipe & reseed the staging data after deploy'
        type: boolean
        default: false

# Required for keyless auth to GCP via Workload Identity Federation (OIDC).
permissions:
  contents: read
  id-token: write


# THE SERIALISATION IS ON THE DEPLOY JOB, NOT ON THE WORKFLOW — see below.

jobs:
  # Gate: the same checks a pull request gets. This workflow fires on every push
  # to main, including pushes that never went through a PR, so without this the
  # staging deploy is the first thing to ever run the code.
  #
  # It is also the ONLY thing that verifies `main` itself (verify.yml's own
  # triggers are `pull_request` and `workflow_call`), which is why it must not
  # be inside a queue that drops runs — see the deploy job's concurrency.
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    name: Deploy to Staging
    needs: verify
    runs-on: ubuntu-latest
    environment: staging

    # One staging deploy at a time, in order. Two merges minutes apart used to
    # run two concurrent `firebase deploy`s against the same project
    # (2026-08-26/27); the second now waits for the first. Never cancel a deploy
    # in flight.
    #
    # ON THE JOB, because as a WORKFLOW-level group it also queued the `verify`
    # job above — and a concurrency group holds exactly ONE pending run, so a
    # third merge cancels the second while it waits. On 2026-09-11, eight
    # commits reached `main` and five of their runs were cancelled before
    # anything ran: those commits were never checked by anything.
    #
    # Serialising the DEPLOY alone keeps the invariant this group exists for
    # while letting every commit's checks run. Dropping a queued deploy is fine
    # and always was — the run that replaces it deploys a tree containing the
    # one it displaced. Dropping a queued VERIFY is not: the commit simply goes
    # unchecked, and when `main` does break, nothing names which merge did it.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Pinned to 22.22.3: Node 22.23.0 carries a keep-alive regression
          # (nodejs/node#63989) that makes firebase-tools' STS token exchange
          # fail with "Premature close" under Workload Identity Federation, so
          # `firebase deploy` reports "Failed to authenticate". Unpin once Node
          # ships a fix. gcloud (Python) is unaffected.
          node-version: '22.22.3'
          cache: 'pnpm'

      # Keyless auth — exchanges the GitHub OIDC token for short-lived GCP
      # credentials and writes an ADC file. firebase-tools and gcloud both read
      # it automatically; no JSON service-account key is involved.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @linyup/shared run build

      - name: Build functions
        run: pnpm --filter @linyup/functions run build

      # Cloud Build (run by `firebase deploy`) only sees packages/functions and
      # uses plain `npm install`, which cannot resolve pnpm's `workspace:*`
      # protocol for @linyup/shared. Vendor the built shared package into
      # packages/functions and rewrite the dep to file:./vendor/shared so npm
      # can install it. Mutates the ephemeral CI checkout only.
      - name: Vendor @linyup/shared for Cloud Build
        run: node scripts/vendor-shared-for-deploy.mjs

      - name: Build help site
        run: pnpm --filter @linyup/help run build

      - name: Build landing site
        run: pnpm --filter @linyup/landing run build
        env:
          PUBLIC_APP_URL: https://app.linyup.com
          PUBLIC_SITE_URL: https://linyup.com
          PUBLIC_DEMO_URL: https://demo.linyup.com
          PUBLIC_FIREBASE_PROJECT_ID: linyup-staging
          # Firebase web API keys are public client identifiers, but keep this out
          # of source (and consistent with prod) via a repo variable. Set the
          # STAGING_FIREBASE_API_KEY Actions variable to the staging web API key.
          PUBLIC_FIREBASE_API_KEY: ${{ vars.STAGING_FIREBASE_API_KEY }}

      # ADC from the auth step is detected automatically — do NOT pass any
      # GOOGLE_APPLICATION_CREDENTIALS* env var here.
      # --force: required in CI so firebase-tools sets up the Artifact Registry
      # cleanup policy non-interactively (otherwise it prompts and exits 1 after a
      # successful deploy) and skips the confirmation prompt when functions are
      # removed from source.
      # Retry wrapper, same as prod and sandbox. The WIF→STS token exchange
      # occasionally fails ("Failed to authenticate") and the per-minute
      # function-mutation quota can 429 on a full re-vendor; both are transient
      # and converge on re-run. Staging deploys unattended on every push to main,
      # so it is the one environment where a transient failure has no human to
      # re-dispatch it — which is exactly why it needs the wrapper most.
      #
      # An exit 0 is not a finished deploy. firebase-tools 15.18 can deadlock a
      # whole group of functions and simply stop, printing neither "Deploy
      # complete!" nor an error — it did to sandbox and prod on 2026-09-18, behind
      # green runs. So an attempt counts only when that line was printed; the
      # retry then re-plans only what was left, because everything finished is
      # skipped as unchanged. The header of scripts/check-functions-ready.mjs has
      # the mechanism.
      - name: Deploy to Firebase (Staging)
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/firebase-deploy.log"
          for attempt in 1 2 3 4 5; do
            if npx firebase-tools deploy --project staging --only functions,hosting:landing,hosting:help,hosting:api,firestore,storage --non-interactive --force 2>&1 | tee "$log" \
              && grep -q 'Deploy complete!' "$log"; then
              exit 0
            fi
            echo "::warning::firebase deploy attempt $attempt failed or stopped before 'Deploy complete!'; retrying in 30s…"
            sleep 30
          done
          echo "::error::firebase deploy failed after 5 attempts"
          exit 1

      # A green deploy step is not a deployed backend. `firebase deploy` can exit
      # 0 while Cloud Run refuses the new revisions — the regional CPU quota did
      # it to sandbox and prod on 2026-09-16, leaving functions on code up to two
      # weeks old behind green runs. Each one still reads ACTIVE and already
      # carries the new hash, so the retry above skips it as unchanged. This
      # reads the truth off Cloud Run so a green run means a deployed one. The
      # reasoning, and the redeploy it prints, belong to the header of
      # scripts/check-functions-ready.mjs.
      - name: Verify every function serves the deployed code
        run: pnpm functions:ready --project linyup-staging

      # Optional reseed — manual dispatch + reseed_data=true only, so routine
      # deploys never wipe staging data. Reuses the ADC from the auth step; the
      # deploy SA's roles/firebase.admin covers Firestore + Auth writes.
      # GOOGLE_CLOUD_PROJECT is pinned to satisfy reset-staging-db.ts's project
      # guard regardless of what the auth step exported. Runs after deploy so the
      # fresh data lands against the just-deployed rules/indexes.
      - name: Reseed staging data (destructive)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reseed_data }}
        env:
          GOOGLE_CLOUD_PROJECT: linyup-staging
        run: |
          pnpm staging:reset
          pnpm staging:seed
