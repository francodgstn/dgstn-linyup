name: Deploy Sandbox

# The whole sandbox environment: Cloud Functions + Firestore rules/indexes +
# Storage rules, then the App Hosting web app — in that order.
#
# TAG-DRIVEN — deliberately. The sandbox hosts live lead demos, so nothing lands
# in it unattended: a rules change that denies a read, or a function that throws,
# would otherwise break a demo mid-pitch. Push a `sandbox-*` tag when you're
# ready to ship:
#
#   git tag sandbox-2026-07-28 && git push origin sandbox-2026-07-28
#
# The tag list IS the deployment record — `git tag -l 'sandbox-*'` is every
# deploy in order, and `git diff $(git describe --tags --abbrev=0 --match
# 'sandbox-*') main` is what hasn't shipped yet. Tag commits that are on `main`:
# the rollout resolves the commit through the Developer Connect repo link, so an
# orphan commit is asking for trouble. Sandbox deliberately drifts behind main —
# tag before a demo if backend code changed.
#
# workflow_dispatch stays as the escape hatch: re-running a half-failed deploy
# shouldn't require minting a throwaway tag.
#
# PREREQUISITE — automatic rollouts must be OFF for the sandbox `linyup-web-eu`
# App Hosting backend (Console → App Hosting → backend → ⚙ Settings →
# Deployment / rollouts). Otherwise every push to `main` still ships the web app
# behind this workflow's back, and the frontend drifts ahead of the backend it
# calls. Leave the GitHub repo connected — the manual rollout below still builds
# from it. Same arrangement as prod (infra/README.md §6), which also documents
# the two Developer Connect roles the deploy SA needs to create a rollout.
#
# Demo *data* is only ever touched by an explicit dispatch with the box ticked —
# a tag push carries no inputs, so it can never reseed.

on:
  push:
    tags: ['sandbox-*']
  workflow_dispatch:
    inputs:
      reseed_demo:
        description: 'DESTRUCTIVE: wipe & reseed the /try demo data after deploy (lead tenants are preserved)'
        type: boolean
        default: false

# Required for keyless auth to GCP via Workload Identity Federation (OIDC).
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Sandbox (functions, firestore, storage)
    runs-on: ubuntu-latest
    environment: sandbox

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Pinned to 22.22.3: Node 22.23.0 carries a keep-alive regression
          # (nodejs/node#63989) that makes firebase-tools' STS token exchange
          # fail with "Premature close" under Workload Identity Federation, so
          # `firebase deploy` reports "Failed to authenticate". Unpin once Node
          # ships a fix. gcloud (Python) is unaffected.
          node-version: '22.22.3'
          cache: 'pnpm'

      # Keyless auth — exchanges the GitHub OIDC token for short-lived GCP
      # credentials and writes an ADC file. firebase-tools reads it automatically;
      # no JSON service-account key is involved. The deploy SA already has roles on
      # linyup-sandbox (granted by infra/environments/sandbox iam module).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @linyup/shared run build

      - name: Build functions
        run: pnpm --filter @linyup/functions run build

      # Cloud Build (run by `firebase deploy`) only sees packages/functions and
      # uses plain `npm install`, which cannot resolve pnpm's `workspace:*`
      # protocol for @linyup/shared. Vendor the built shared package into
      # packages/functions and rewrite the dep to file:./vendor/shared so npm can
      # install it. Mutates the ephemeral CI checkout only.
      - name: Vendor @linyup/shared for Cloud Build
        run: node scripts/vendor-shared-for-deploy.mjs

      # ADC from the auth step is detected automatically — do NOT pass any
      # GOOGLE_APPLICATION_CREDENTIALS* env var here.
      # --force: lets firebase-tools set up the Artifact Registry cleanup policy
      # non-interactively and skips the confirmation prompt when functions are
      # removed from source. No hosting:landing (sandbox has no landing site), but
      # hosting:api IS deployed: the api site is only a rewrite onto the `api`
      # function, and without a release the demo API would 404 (docs/public-api.md). And
      # no database — RTDB is unused and the sandbox project has no RTDB instance
      # (deploying its rules would fail with "haven't created a Realtime Database
      # instance").
      # Retry wrapper, same as deploy-prod.yml's. A release that touches
      # `packages/shared` re-vendors it into EVERY function, so all ~80 update in
      # one pass and Cloud Functions' per-minute mutation quota 429s partway
      # through — which is a transient rate limit, not a bad build. Re-running
      # converges because an already-updated function is skipped next pass, and
      # the 30s gap lets the quota window roll over. The WIF→STS token exchange
      # occasionally fails the same way.
      #
      # This wrapper was missing here while prod had it, so the 2026-08-25 deploy
      # failed with 25 functions un-updated and needed a manual re-dispatch.
      #
      # An exit 0 is not a finished deploy. firebase-tools 15.18 can deadlock a
      # whole group of functions and simply stop, printing neither "Deploy
      # complete!" nor an error: on 2026-09-18 every 512Mi function here was never
      # deployed, a new one never created, and the api Hosting release never made,
      # behind a green run. So an attempt counts only when that line was printed;
      # the retry then re-plans only what was left, because everything finished
      # is skipped as unchanged. The header of scripts/check-functions-ready.mjs
      # has the mechanism.
      - name: Deploy to Firebase (Sandbox)
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/firebase-deploy.log"
          for attempt in 1 2 3 4 5; do
            if npx firebase-tools deploy --project sandbox --only functions,hosting:api,firestore,storage --non-interactive --force 2>&1 | tee "$log" \
              && grep -q 'Deploy complete!' "$log"; then
              exit 0
            fi
            echo "::warning::firebase deploy attempt $attempt failed or stopped before 'Deploy complete!'; retrying in 30s…"
            sleep 30
          done
          echo "::error::firebase deploy failed after 5 attempts"
          exit 1

      # A green deploy step is not a deployed backend. `firebase deploy` can exit
      # 0 while Cloud Run refuses the new revisions — the regional CPU quota did
      # it on 2026-09-16, and 81 functions here went on serving code up to two
      # weeks old. Each one still reads ACTIVE and already carries the new hash,
      # so the retry above skips it as unchanged. This reads the truth off Cloud
      # Run and fails the run BEFORE the web rollout, so the frontend never goes
      # live over a backend it is ahead of. The reasoning, and the redeploy it
      # prints, belong to the header of scripts/check-functions-ready.mjs.
      - name: Verify every function serves the deployed code
        run: pnpm functions:ready --project linyup-sandbox

      # App Hosting (Next.js SSR) — the web app, rolled out AFTER the backend
      # above so the frontend never goes live ahead of the functions and rules it
      # calls. Auto-rollout must be OFF on this backend (see the header), or this
      # step is racing the Console's own trigger.
      #
      # We roll out the exact commit being deployed ($GITHUB_SHA — on a tag push
      # that is the tagged commit) rather than a branch tip, so a concurrent merge
      # to main can't sneak into the rollout. Sandbox has ONE backend, linyup-web-eu;
      # there is no admin console here (prod and staging have both).
      #
      # Retry wrapper, same as prod: the WIF→STS token exchange occasionally
      # fails ("Failed to authenticate"). Transient, converges on re-run.
      - name: Roll out web app (App Hosting, sandbox)
        run: |
          for attempt in 1 2 3 4 5; do
            if npx firebase-tools apphosting:rollouts:create linyup-web-eu --project sandbox --git-commit "$GITHUB_SHA" --non-interactive; then
              exit 0
            fi
            echo "::warning::web rollout attempt $attempt failed; retrying in 30s…"
            sleep 30
          done
          echo "::error::web rollout failed after 5 attempts"
          exit 1

      # Optional demo reseed — reseed_demo=true only, so a routine backend deploy
      # never wipes the running demo. Reuses the ADC from the auth step; the
      # deploy SA's roles/firebase.admin covers Firestore + Auth writes.
      # GOOGLE_CLOUD_PROJECT is pinned to satisfy reset-sandbox-db.ts's project
      # guard regardless of what the auth step exported. Runs after deploy so the
      # fresh data lands against the just-deployed rules/indexes (e.g. fromBioLink).
      #
      # `--yes` is the non-interactive escape hatch for the typed confirmation
      # (there is no TTY here). LEAD TENANTS ARE PRESERVED by default — this only
      # resets the /try playground. Wiping a lead demo is deliberately not
      # reachable from CI; do it locally with `pnpm lead:seed --lead <id> --reset`.
      - name: Reseed /try demo data (destructive)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reseed_demo }}
        env:
          GOOGLE_CLOUD_PROJECT: linyup-sandbox
        run: |
          pnpm sandbox:reset --yes
          pnpm sandbox:seed
