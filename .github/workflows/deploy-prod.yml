name: Deploy Production

# Production deploys are manual-gated: trigger by hand (workflow_dispatch) or by
# pushing a release tag. The `production` GitHub environment should require a
# manual reviewer approval before this job runs.
on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  # Gate: a release tag can point at any commit, and `verify` previously ran on
  # pull requests only — so a `v*` tag could ship to production having never been
  # typechecked, linted or tested. This runs BEFORE the environment approval, so a
  # reviewer is never asked to approve something that has not passed its checks.
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    name: Deploy to Production
    needs: verify
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Pinned to 22.22.3: Node 22.23.0 carries a keep-alive regression
          # (nodejs/node#63989) that makes firebase-tools' STS token exchange
          # fail with "Premature close" under Workload Identity Federation, so
          # `firebase deploy` reports "Failed to authenticate". Unpin once Node
          # ships a fix. gcloud (Python) is unaffected.
          node-version: '22.22.3'
          cache: 'pnpm'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          # Use the shared CI SA (linyup-ci-deploy@linyup-admin): it's the only
          # service account with a working Workload Identity binding (provisioned
          # in infra/bootstrap) and it already holds prod-project roles. The
          # separate GCP_PROD_DEPLOY_SA has no WIF binding, so impersonation fails
          # and firebase-tools reports "Failed to authenticate". Reinstate a
          # dedicated prod SA with a refs/heads/main ref condition via Terraform
          # later, then switch this back to GCP_PROD_DEPLOY_SA.
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @linyup/shared run build

      - name: Build functions
        run: pnpm --filter @linyup/functions run build

      # Cloud Build (run by `firebase deploy`) only sees packages/functions and
      # uses plain `npm install`, which cannot resolve pnpm's `workspace:*`
      # protocol for @linyup/shared. Vendor the built shared package into
      # packages/functions and rewrite the dep to file:./vendor/shared so npm
      # can install it. Mutates the ephemeral CI checkout only.
      - name: Vendor @linyup/shared for Cloud Build
        run: node scripts/vendor-shared-for-deploy.mjs

      - name: Build landing site
        run: pnpm --filter @linyup/landing run build
        env:
          PUBLIC_APP_URL: https://app.linyup.com
          PUBLIC_SITE_URL: https://linyup.com
          PUBLIC_FIREBASE_PROJECT_ID: linyup-prod
          PUBLIC_FIREBASE_API_KEY: ${{ vars.PROD_FIREBASE_API_KEY }}
          # PostHog product analytics — set the PROD_POSTHOG_KEY repo variable to the
          # public project key (phc_…). Unset → analytics stays off (no script loads).
          PUBLIC_POSTHOG_KEY: ${{ vars.PROD_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com

      # Backend first: functions, Firestore rules/indexes, Storage rules, and the
      # static landing site. The App Hosting apps (web + admin) are rolled out
      # AFTER this so the frontend never goes live ahead of the backend it depends on.
      #
      # ⚠️ `storage` was MISSING from this list while staging and sandbox both had
      # it, so storage.rules had never reached production through the pipeline —
      # prod ran on whatever was last pushed by hand, and every tenant-isolation
      # change to that file silently stopped at staging. BEFORE the first run that
      # includes it, diff the repo's storage.rules against what is actually live in
      # prod (Firebase Console → Storage → Rules): this deploy REPLACES the live
      # ruleset, so any hand-edit made directly in the Console is about to be
      # reverted. Confirm the difference is only what you intend to ship.
      # Retry wrapper: the WIF→STS token exchange occasionally fails ("Failed to
      # authenticate") and the per-minute Cloud Functions mutation quota 429s on a
      # full redeploy. Both are transient and converge on re-run (auth blips clear;
      # already-updated functions are skipped next pass). 30s gaps let the quota reset.
      #
      # An exit 0 is not a finished deploy. firebase-tools 15.18 can deadlock a
      # whole group of functions and simply stop, printing neither "Deploy
      # complete!" nor an error: v0.28.0's first run (2026-09-18) never deployed
      # any 512Mi function here, never created a new one and never released the
      # api Hosting version, behind a green run. So an attempt counts only when
      # that line was printed; the retry then re-plans only what was left,
      # because everything finished is skipped as unchanged. The header of
      # scripts/check-functions-ready.mjs has the mechanism.
      - name: Deploy to Firebase (Production)
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/firebase-deploy.log"
          for attempt in 1 2 3 4 5; do
            if npx firebase-tools deploy --project production --only functions,hosting:landing,hosting:api,firestore,storage --non-interactive --force 2>&1 | tee "$log" \
              && grep -q 'Deploy complete!' "$log"; then
              exit 0
            fi
            echo "::warning::firebase deploy attempt $attempt failed or stopped before 'Deploy complete!'; retrying in 30s…"
            sleep 30
          done
          echo "::error::firebase deploy failed after 5 attempts"
          exit 1

      # A green deploy step is not a deployed backend. `firebase deploy` can exit
      # 0 while Cloud Run refuses the new revisions — the regional CPU quota did
      # it on 2026-09-16, and 61 functions here went on serving code from as far
      # back as 2026-09-08. Each one still read ACTIVE and already carried the new
      # hash, so the retry above skipped it as unchanged and the run went green.
      # This reads the truth off Cloud Run and fails the run BEFORE the App
      # Hosting rollouts, so neither frontend goes live over a backend it is
      # ahead of. The reasoning, and the redeploy it prints, belong to the header
      # of scripts/check-functions-ready.mjs.
      - name: Verify every function serves the deployed code
        run: pnpm functions:ready --project linyup-prod

      # App Hosting (Next.js SSR) — web + admin. Auto-rollout is DISABLED on the
      # PROD backends (see infra/README.md §6), so prod ships ONLY through this
      # gated workflow, in lockstep with the backend deploy above. We roll out the
      # exact commit being deployed ($GITHUB_SHA) rather than a branch tip, so a
      # concurrent merge can't sneak into the production rollout.
      - name: Roll out web app (App Hosting, prod)
        run: |
          for attempt in 1 2 3 4 5; do
            if npx firebase-tools apphosting:rollouts:create linyup-web-eu --project production --git-commit "$GITHUB_SHA" --non-interactive; then
              exit 0
            fi
            echo "::warning::web rollout attempt $attempt failed; retrying in 30s…"
            sleep 30
          done
          echo "::error::web rollout failed after 5 attempts"
          exit 1

      - name: Roll out operator console (App Hosting, prod)
        run: |
          for attempt in 1 2 3 4 5; do
            if npx firebase-tools apphosting:rollouts:create linyup-admin-eu --project production --git-commit "$GITHUB_SHA" --non-interactive; then
              exit 0
            fi
            echo "::warning::operator console rollout attempt $attempt failed; retrying in 30s…"
            sleep 30
          done
          echo "::error::operator console rollout failed after 5 attempts"
          exit 1
