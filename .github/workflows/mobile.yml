# Member app lanes — decoupled from the backend's v* release train.
#
#   PR touching the app or shared      → lint, jest, tsc, `expo config` per profile
#   main merge touching the app/shared → the `staging` channel: an OTA update when a
#                                        build with the current native fingerprint
#                                        already exists, a `preview` BUILD otherwise
#                                        (ANDROID ONLY for now — see the staging job)
#   mobile-v* tag                      → the `production` channel: same rule with the
#                                        `store` profile. It NEVER submits — see below.
#
# Why a separate tag: docs/mobile-roadmap-2026-09.md §3. Why fingerprint:
# app.config.js sets runtimeVersion.policy = 'fingerprint', so an update can only
# land on builds whose native project hashes the same — "does a build with this
# fingerprint exist on this profile" IS the OTA-vs-build question, and Expo's
# continuous-deploy-fingerprint action is the maintained implementation of it
# (it computes both platforms' fingerprints, checks EAS for matching builds,
# triggers builds that are missing, publishes updates otherwise, and comments
# the result on the commit/PR).
#
# Secrets: EXPO_TOKEN (repository secret). FIREBASE_API_KEY lives in TWO
# places, which are different channels and not redundant: eas.json's `env`
# block per profile (what `eas build` uses to evaluate app.config.js LOCALLY,
# before upload) and an EAS environment variable per environment (what the
# BUILDER gets, and what `eas update --environment` resolves). The trap is
# writing `"${FIREBASE_API_KEY}"` in eas.json — it does not interpolate and
# bakes in that literal string. Write the value.
#
# Action version: the `continuous-deploy-fingerprint` sub-action exists on
# expo-github-action v9 (and main) — NOT on the v8 tag, where the first run on
# main died with "Can't find action.yml". Its inputs (profile, branch,
# environment, platform, auto-submit-builds, github-token, working-directory)
# are verified against v9's action.yml. `environment` is passed explicitly so
# the EAS environment variables (FIREBASE_API_KEY) apply to `eas update` as
# well as to the build the profile names.
#
# Settled 2026-09-03, when docs/mobile-eas-setup.md was executed for staging:
# `auto-submit-builds` IS the input's real name (checked against v9's
# action.yml). The first run on main then failed with nothing but an exit
# code, because `eas build` evaluates app.config.js locally with ONLY
# eas.json's `env` in scope and our config refuses a real project without a
# key — see the runbook's step 5. Both channels now carry the prod key, so the
# release lane can build.
#
# NO AUTO-SUBMIT, deliberately (2026-09-10). The fingerprint is computed on the
# RUNNER, and a reference build made on a dev machine hashes differently — a
# Windows checkout alone shifts it, via CRLF in the .gitignore that decides what
# fingerprint skips. So "no matching build" is the NORMAL outcome here, not a
# signal that anything changed, and with `auto-submit-builds` that outcome put an
# unreviewed binary in front of both stores. It did, once. A miss must cost a
# build and nothing more; submitting stays a deliberate `eas submit`.
name: Mobile

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - '.github/workflows/mobile.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - '.github/workflows/mobile.yml'
    tags: ['mobile-v*']
  workflow_dispatch: {}

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: Lint · test · typecheck · config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @linyup/shared run build

      - name: Lint
        run: pnpm --filter @linyup/mobile run lint

      # No `-- --ci`: pnpm hands the `--` to Jest as a test-path pattern (zero
      # matches, red job — the first run on main). Jest reads CI=true, which
      # GitHub sets, and behaves as --ci from that alone.
      - name: Unit tests
        run: pnpm --filter @linyup/mobile run test

      - name: Typecheck
        run: pnpm --filter @linyup/mobile run typecheck

      # Every build profile must evaluate app.config.js without throwing — the
      # class of failure that otherwise surfaces only on EAS's clock (the HMD-era
      # eas.json pointed at project ids the config rejects, for weeks).
      #
      # This step used to inject FIREBASE_API_KEY=ci-placeholder, which made it
      # PASS while `eas build` failed — the first run on main, 2026-09-03. So it
      # now reproduces what EAS actually does: only the profile's own `env`, plus
      # EXPO_NO_DOTENV=1, and no key handed in from the side. `--type public`
      # rather than `--json` because JSON mode exits 1 with EMPTY stderr, which
      # is what made the original failure unreadable.
      - name: Evaluate app config per build profile, as `eas build` does
        working-directory: apps/mobile
        run: |
          for profile in development preview store; do
            echo "== profile: $profile =="
            env EXPO_NO_DOTENV=1 \
              $(node -p "Object.entries(require('./eas.json').build['$profile'].env||{}).map(([k,v])=>k+'='+v).join(' ')") \
              npx expo config --type public > /dev/null
          done

      # `store` is in the loop above now that it carries a key. It points at
      # linyup-STAGING for the moment (see the release job below), so nothing in
      # that loop exercises linyup-prod any more — this step is what keeps the
      # prod project id honest. A placeholder key is fine for that one question.
      - name: Prod project id is known to the config
        working-directory: apps/mobile
        run: FIREBASE_PROJECT_ID=linyup-prod FIREBASE_API_KEY=ci-placeholder npx expo config --type public > /dev/null

  # ── main → staging channel ────────────────────────────────────────────────
  staging:
    name: Staging channel
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @linyup/shared run build

      - name: OTA update, or preview build when the native fingerprint changed
        uses: expo/expo-github-action/continuous-deploy-fingerprint@v9
        with:
          working-directory: apps/mobile
          profile: preview
          branch: staging
          environment: preview
          # Android only, deliberately. With no build matching the current
          # fingerprint the action BUILDS rather than updates, and an iOS
          # internal-distribution build needs an ad hoc provisioning profile
          # listing device UDIDs — i.e. an Apple Developer login and
          # `eas device:create`, neither of which exists yet. `all` here would
          # make every run on main red on its iOS half. Widen to `all` once
          # the Apple account is set up (docs/mobile-roadmap-2026-09.md §7).
          platform: android
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ── mobile-v* → production channel / store ────────────────────────────────
  release:
    name: Production channel / store
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      # The `store` profile is TEMPORARILY pointed at linyup-staging so the Play
      # closed test can start without the prod key being decided
      # (docs/mobile-store-setup.md). A `mobile-v*` tag means a REAL release, and
      # a store build that talks to staging would put real members on seeded demo
      # data that gets wiped and reseeded. eas.json cannot hold a comment saying
      # so, and a note in a doc is not a guard — this is.
      - name: The store profile must target production
        run: |
          id=$(node -p "require('./apps/mobile/eas.json').build.store.env.FIREBASE_PROJECT_ID")
          if [ "$id" != "linyup-prod" ]; then
            echo "::error::eas.json store profile targets $id, not linyup-prod — switch it back, with the prod key, before tagging a release. See docs/mobile-store-setup.md."
            exit 1
          fi
          echo "store profile targets $id"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @linyup/shared run build

      - name: OTA update, or store build when the native fingerprint changed
        uses: expo/expo-github-action/continuous-deploy-fingerprint@v9
        with:
          working-directory: apps/mobile
          profile: store
          branch: production
          environment: production
          platform: all
          github-token: ${{ secrets.GITHUB_TOKEN }}
